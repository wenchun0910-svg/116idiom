<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成語填填看</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/max32002/iansui/iansui.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Iansui', 'Noto Serif TC', serif;
            background-color: #fce7f3; /* 柔和的粉底色 */
            background-image: radial-gradient(#fbcfe8 2px, transparent 2px);
            background-size: 30px 30px;
            user-select: none;
        }
        .chalkboard {
            background-color: #1e293b;
            border: 12px solid #8b5cf6; /* 高對比紫色邊框 */
            border-radius: 20px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 10px 25px rgba(0,0,0,0.2);
            color: #f8fafc;
        }
        .btn-press {
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-press:active {
            transform: scale(0.95);
        }
        .bar-transition {
            transition: width 0.1s linear;
        }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- 遊戲主容器 -->
    <div id="app" x-data="gameApp" x-cloak class="w-full max-w-3xl chalkboard relative overflow-hidden">
        
        <!-- 1. 載入畫面 -->
        <div x-show="view === 'loading'" class="h-96 flex flex-col items-center justify-center">
            <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-yellow-400 mb-4"></div>
            <h2 class="text-2xl tracking-widest">系統初始化中...</h2>
        </div>

        <!-- 2. 首頁 / 登入畫面 -->
        <div x-show="view === 'home'" class="p-8 h-96 flex flex-col items-center justify-center">
            <h1 class="text-5xl font-bold text-yellow-300 mb-8 drop-shadow-md">成語填填看</h1>
            
            <div x-show="isOffline" class="bg-red-500 text-white px-4 py-1 rounded-full text-sm mb-4 animate-pulse">
                目前為離線單機模式 (未連結資料庫)
            </div>

            <input type="text" x-model="playerName" placeholder="請輸入您的姓名..." 
                   class="text-2xl text-center p-3 rounded-xl border-4 border-yellow-400 bg-slate-800 text-white placeholder-slate-400 focus:outline-none focus:border-yellow-200 mb-6 w-64 transition-colors">
            
            <div class="flex gap-4">
                <button @click="startGame" class="btn-press bg-yellow-400 text-slate-900 text-2xl font-bold py-3 px-8 rounded-full shadow-lg hover:bg-yellow-300">
                    開始遊戲
                </button>
                <button @click="enterAdmin" class="btn-press bg-slate-600 text-white text-xl py-3 px-6 rounded-full shadow-lg hover:bg-slate-500">
                    管理員
                </button>
            </div>
            <div class="absolute bottom-4 right-6 text-sm text-slate-400 opacity-70">© 文君製作</div>
        </div>

        <!-- 3. 遊戲進行畫面 -->
        <div x-show="view === 'game'" class="p-6">
            <!-- 血條區塊 -->
            <div class="flex justify-between items-center mb-4 gap-4">
                <div class="flex-1">
                    <div class="text-sm text-yellow-300 mb-1 font-bold">剩餘時間</div>
                    <div class="h-4 bg-slate-700 rounded-full overflow-hidden">
                        <div class="h-full bg-blue-500 bar-transition" :style="`width: ${(timeLeft / maxTime) * 100}%`"></div>
                    </div>
                </div>
                <div class="flex-1">
                    <div class="text-sm text-red-300 mb-1 font-bold">生命值</div>
                    <div class="h-4 bg-slate-700 rounded-full overflow-hidden">
                        <div class="h-full bg-red-500 bar-transition" :style="`width: ${(hp / maxHp) * 100}%`"></div>
                    </div>
                </div>
                <div class="text-2xl font-bold text-yellow-400">第 <span x-text="currentQuestionIndex + 1"></span> 題</div>
            </div>

            <!-- 題目區塊 -->
            <div class="flex justify-center items-center h-40 my-8">
                <div class="text-7xl font-bold tracking-[0.2em] flex gap-4">
                    <template x-for="(char, index) in currentIdiom.split('')">
                        <span class="w-20 h-24 flex items-center justify-center border-b-8 border-yellow-400"
                              :class="index === blankIndex ? 'text-yellow-400 bg-slate-700 rounded-lg' : 'text-white'"
                              x-text="index === blankIndex ? '？' : char">
                        </span>
                    </template>
                </div>
            </div>

            <!-- 選項區塊 -->
            <div class="grid grid-cols-2 gap-4 max-w-lg mx-auto mb-4">
                <template x-for="option in options">
                    <button @click="checkAnswer(option)" 
                            :disabled="isChecking"
                            class="btn-press bg-slate-700 hover:bg-slate-600 text-yellow-300 text-4xl font-bold py-4 rounded-xl border-2 border-slate-500 transition-colors disabled:opacity-50">
                        <span x-text="option"></span>
                    </button>
                </template>
            </div>
        </div>

        <!-- 4. 結算畫面 -->
        <div x-show="view === 'result'" class="p-8 flex flex-col items-center justify-center">
            <h2 class="text-5xl font-bold text-yellow-300 mb-6">遊戲結束</h2>
            <div class="text-2xl mb-4 bg-slate-800 p-6 rounded-2xl border-2 border-slate-600 w-full max-w-md">
                <p class="mb-2">玩家：<span class="text-yellow-400" x-text="playerName"></span></p>
                <p class="mb-2">答對題數：<span class="text-green-400" x-text="score"></span></p>
                <p>答錯題數：<span class="text-red-400" x-text="wrongCount"></span></p>
            </div>
            <div class="flex gap-4 mt-6">
                <button @click="view = 'home'" class="btn-press bg-blue-500 text-white text-xl py-3 px-8 rounded-full hover:bg-blue-400">回首頁</button>
                <button @click="view = 'leaderboard'" class="btn-press bg-yellow-500 text-slate-900 text-xl py-3 px-8 rounded-full hover:bg-yellow-400 font-bold">查看排名</button>
            </div>
        </div>

        <!-- 5. 排名畫面 -->
        <div x-show="view === 'leaderboard'" class="p-8 flex flex-col h-full">
            <h2 class="text-3xl font-bold text-yellow-300 mb-4 text-center">英雄榜</h2>
            <div class="flex-1 bg-slate-800 rounded-xl p-4 overflow-y-auto border-2 border-slate-600 h-64 mb-4">
                <template x-for="(record, index) in leaderboardData">
                    <div class="flex justify-between items-center border-b border-slate-700 py-2 text-lg">
                        <div>
                            <span class="inline-block w-8 text-yellow-500 font-bold" x-text="`#${index + 1}`"></span>
                            <span x-text="record.name" class="text-white"></span>
                        </div>
                        <div class="text-green-400 font-bold" x-text="`${record.score} 題`"></div>
                    </div>
                </template>
                <div x-show="leaderboardData.length === 0" class="text-center text-slate-400 mt-8">尚無排名紀錄</div>
            </div>
            <button @click="view = 'home'" class="btn-press bg-slate-600 text-white text-lg py-2 px-6 rounded-full mx-auto block hover:bg-slate-500">返回</button>
        </div>

        <!-- 6. 管理員登入與後台 -->
        <div x-show="view === 'admin'" class="p-8 flex flex-col h-full">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-3xl font-bold text-yellow-300">題庫管理後台</h2>
                <button @click="view = 'home'" class="text-slate-400 hover:text-white">✕ 關閉</button>
            </div>

            <!-- 登入卡控 -->
            <div x-show="!isAdminLoggedIn" class="flex flex-col items-center justify-center h-48">
                <input type="password" x-model="adminPasswordInput" placeholder="請輸入管理員密碼" class="text-xl p-2 rounded border border-slate-500 bg-slate-700 text-white mb-4 text-center">
                <button @click="loginAdmin" class="btn-press bg-yellow-500 text-slate-900 px-6 py-2 rounded-full font-bold">登入</button>
                <p class="text-red-400 mt-2 text-sm" x-show="adminLoginError">密碼錯誤</p>
                <p class="text-slate-400 mt-4 text-xs">預設密碼為: admin</p>
            </div>

            <!-- 後台管理介面 -->
            <div x-show="isAdminLoggedIn" class="flex flex-col gap-4">
                <div class="bg-slate-800 p-4 rounded-xl border border-slate-600">
                    <h3 class="text-xl text-yellow-300 mb-2">新增成語</h3>
                    <div class="flex gap-2">
                        <input type="text" x-model="newLesson" placeholder="課別 (例: 第一課)" class="flex-1 p-2 rounded bg-slate-700 text-white text-sm">
                        <input type="text" x-model="newIdiom" placeholder="四字成語 (例: 一馬當先)" class="flex-2 p-2 rounded bg-slate-700 text-white text-sm">
                        <button @click="addIdiom" class="bg-green-500 hover:bg-green-400 text-white px-4 py-2 rounded">新增</button>
                    </div>
                </div>

                <div class="flex-1 bg-slate-800 rounded-xl p-4 overflow-y-auto border border-slate-600 h-48">
                    <table class="w-full text-left text-sm text-slate-300">
                        <thead>
                            <tr class="border-b border-slate-600 text-yellow-400">
                                <th class="pb-2">課別</th>
                                <th class="pb-2">成語</th>
                                <th class="pb-2 text-right">操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="item in idiomsList">
                                <tr class="border-b border-slate-700">
                                    <td class="py-2" x-text="item.lesson"></td>
                                    <td class="py-2 text-white text-lg tracking-widest" x-text="item.word"></td>
                                    <td class="py-2 text-right">
                                        <button @click="deleteIdiom(item.id)" class="text-red-400 hover:text-red-300 text-xs border border-red-400 px-2 py-1 rounded">刪除</button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 答錯提示彈窗 -->
        <div x-show="showWrongAnswerPopup" 
             x-transition.duration.300ms
             class="absolute inset-0 bg-black/80 flex items-center justify-center z-50">
            <div class="bg-slate-800 border-4 border-red-500 rounded-2xl p-8 text-center shadow-2xl transform scale-110">
                <h3 class="text-3xl text-red-400 font-bold mb-4">答錯囉！</h3>
                <p class="text-xl text-slate-300 mb-2">正確答案是：</p>
                <div class="text-6xl font-bold text-yellow-300 tracking-[0.2em] mb-4" x-text="correctAnswer"></div>
                <div class="text-sm text-slate-400">稍後自動進入下一題...</div>
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, push, remove, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import Alpine from 'https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/module.esm.js';

        /* 
        ========================================================================
        🌟🌟🌟🔥 Firebase 資料庫連線設定 (請填入您的金鑰) 🔥🌟🌟🌟
        ========================================================================
        */
        const myFirebaseConfig = {
           apiKey: "AIzaSyAiai_EXmE8kM4iyJxqf5azORkmzbB0xLY",
  authDomain: "idiom-4f7c0.firebaseapp.com",
  projectId: "idiom-4f7c0",
  storageBucket: "idiom-4f7c0.firebasestorage.app",
  messagingSenderId: "1078951444674",
  appId: "1:1078951444674:web:e6fe94ac4dbba15ed37b5b"
        };

        // 音效引擎 (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'click') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            }
        }

        document.addEventListener('alpine:init', () => {
            Alpine.data('gameApp', () => ({
                view: 'loading',
                isOffline: true,
                db: null,
                
                // 玩家資料
                playerName: '',
                score: 0,
                wrongCount: 0,
                
                // 遊戲狀態
                hp: 3,
                maxHp: 3,
                timeLeft: 10,
                maxTime: 10,
                timer: null,
                isChecking: false,
                
                // 題目資料
                idiomsList: [
                    { id: '1', lesson: '第一課', word: '一馬當先' },
                    { id: '2', lesson: '第一課', word: '兩全其美' },
                    { id: '3', lesson: '第二課', word: '三心二意' },
                    { id: '4', lesson: '第二課', word: '四面楚歌' },
                    { id: '5', lesson: '第三課', word: '五顏六色' },
                    { id: '6', lesson: '第三課', word: '七上八下' }
                ],
                currentIdiomsPool: [],
                currentQuestionIndex: 0,
                currentIdiom: '',
                blankIndex: 0,
                options: [],
                correctAnswer: '',
                showWrongAnswerPopup: false,
                leaderboardData: [],

                // 管理員設定
                isAdminLoggedIn: false,
                adminPasswordInput: '',
                adminLoginError: false,
                newLesson: '',
                newIdiom: '',

                async init() {
                    try {
                        const app = initializeApp(myFirebaseConfig);
                        const auth = getAuth(app);
                        await signInAnonymously(auth);
                        this.db = getDatabase(app);
                        this.isOffline = false;
                        await this.loadData();
                    } catch (error) {
                        console.warn("Firebase 連線失敗，啟用單機測試模式", error);
                        this.isOffline = true;
                    } finally {
                        // 確保不管成功或失敗，都會關閉載入畫面進入首頁
                        this.view = 'home';
                    }
                },

                async loadData() {
                    if (this.isOffline) return;
                    try {
                        const idiomsSnapshot = await get(child(ref(this.db), 'idioms'));
                        if (idiomsSnapshot.exists()) {
                            let data = idiomsSnapshot.val();
                            this.idiomsList = Object.keys(data).map(key => ({ id: key, ...data[key] }));
                        }
                        const lbSnapshot = await get(child(ref(this.db), 'leaderboard'));
                        if (lbSnapshot.exists()) {
                            let data = lbSnapshot.val();
                            this.leaderboardData = Object.keys(data).map(key => data[key]).sort((a,b) => b.score - a.score).slice(0, 10);
                        }
                    } catch(e) { console.error(e); }
                },

                startGame() {
                    playSound('click');
                    if (!this.playerName.trim()) {
                        alert("請先輸入您的姓名喔！");
                        return;
                    }
                    if (this.idiomsList.length === 0) {
                        alert("目前題庫沒有成語，請請管理員新增！");
                        return;
                    }
                    this.score = 0;
                    this.wrongCount = 0;
                    this.hp = this.maxHp;
                    this.currentQuestionIndex = 0;
                    // 複製題庫並洗牌
                    this.currentIdiomsPool = [...this.idiomsList].sort(() => 0.5 - Math.random());
                    this.view = 'game';
                    this.nextQuestion();
                },

                nextQuestion() {
                    if (this.hp <= 0 || this.currentQuestionIndex >= this.currentIdiomsPool.length) {
                        this.endGame();
                        return;
                    }

                    this.isChecking = false;
                    const idiomObj = this.currentIdiomsPool[this.currentQuestionIndex];
                    this.currentIdiom = idiomObj.word;
                    this.blankIndex = Math.floor(Math.random() * 4);
                    const correctChar = this.currentIdiom[this.blankIndex];
                    this.correctAnswer = this.currentIdiom;

                    // 產生混淆選項 (隨機取常見中文字)
                    const poolStr = "天地玄黃宇宙洪荒日月盈昃辰宿列張寒來暑往秋收冬藏";
                    let opts = [correctChar];
                    while(opts.length < 4) {
                        let randChar = poolStr[Math.floor(Math.random() * poolStr.length)];
                        if (!opts.includes(randChar)) opts.push(randChar);
                    }
                    this.options = opts.sort(() => 0.5 - Math.random());
                    
                    this.timeLeft = this.maxTime;
                    clearInterval(this.timer);
                    this.timer = setInterval(() => {
                        this.timeLeft -= 0.1;
                        if (this.timeLeft <= 0) {
                            clearInterval(this.timer);
                            this.handleWrong();
                        }
                    }, 100);
                },

                checkAnswer(ans) {
                    if (this.isChecking) return;
                    this.isChecking = true;
                    clearInterval(this.timer);
                    
                    if (ans === this.currentIdiom[this.blankIndex]) {
                        playSound('correct');
                        this.score++;
                        setTimeout(() => {
                            this.currentQuestionIndex++;
                            this.nextQuestion();
                        }, 500);
                    } else {
                        this.handleWrong();
                    }
                },

                handleWrong() {
                    playSound('wrong');
                    this.wrongCount++;
                    this.hp--;
                    this.showWrongAnswerPopup = true;
                    setTimeout(() => {
                        this.showWrongAnswerPopup = false;
                        this.currentQuestionIndex++;
                        this.nextQuestion();
                    }, 2000);
                },

                async endGame() {
                    clearInterval(this.timer);
                    this.view = 'result';
                    if (!this.isOffline && this.score > 0) {
                        push(ref(this.db, 'leaderboard'), {
                            name: this.playerName,
                            score: this.score,
                            timestamp: Date.now()
                        });
                        await this.loadData();
                    } else if (this.isOffline && this.score > 0) {
                        this.leaderboardData.push({ name: this.playerName, score: this.score });
                        this.leaderboardData.sort((a,b) => b.score - a.score);
                    }
                },

                enterAdmin() {
                    playSound('click');
                    this.adminPasswordInput = '';
                    this.adminLoginError = false;
                    this.view = 'admin';
                },

                loginAdmin() {
                    playSound('click');
                    if (this.adminPasswordInput === 'admin') {
                        this.isAdminLoggedIn = true;
                        this.adminLoginError = false;
                    } else {
                        this.adminLoginError = true;
                    }
                },

                async addIdiom() {
                    if (this.newLesson.trim() && this.newIdiom.trim().length === 4) {
                        const newItem = { lesson: this.newLesson, word: this.newIdiom };
                        if (!this.isOffline) {
                            const newRef = push(ref(this.db, 'idioms'));
                            await set(newRef, newItem);
                            await this.loadData();
                        } else {
                            this.idiomsList.push({ id: Date.now().toString(), ...newItem });
                        }
                        this.newIdiom = '';
                    } else {
                        alert("請確保輸入課別，且成語必須為四個字！");
                    }
                },

                async deleteIdiom(id) {
                    if (confirm('確定要刪除這個成語嗎？')) {
                        if (!this.isOffline) {
                            await remove(ref(this.db, `idioms/${id}`));
                            await this.loadData();
                        } else {
                            this.idiomsList = this.idiomsList.filter(item => item.id !== id);
                        }
                    }
                }
            }));
        });
        Alpine.start();
    </script>
</body>
</html>
